name: Build Rankin Realms APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extract build-ready Android project
        run: |
          rm -rf work
          mkdir -p work
          unzip -q RankinRealms_Android_Source_V4_BUILD_READY.zip -d work
          test -f work/RankinRealms_Android_V3/settings.gradle.kts
          test -f work/RankinRealms_Android_V3/app/build.gradle.kts

      - name: Patch project for stable AGP 9 toolchain and crop controls
        shell: bash
        run: |
          sed -i '/org.jetbrains.kotlin.android/d' work/RankinRealms_Android_V3/build.gradle.kts
          sed -i '/org.jetbrains.kotlin.android/d' work/RankinRealms_Android_V3/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path

          build = Path('work/RankinRealms_Android_V3/app/build.gradle.kts')
          s = build.read_text()
          s = s.replace('compileSdk = 37', 'compileSdk = 36')
          s = s.replace('androidx.compose:compose-bom:2026.08.00', 'androidx.compose:compose-bom:2026.04.01')
          s = s.replace('    kotlinOptions {\n        jvmTarget = "17"\n    }\n\n', '')
          build.write_text(s)

          app = Path('work/RankinRealms_Android_V3/app/src/main/java/com/rankinenvironments/realms/ui/RankinRealmsApp.kt')
          text = app.read_text()
          old = '            Text("Pinch to zoom • drag to choose exactly what is visible", style = MaterialTheme.typography.labelMedium)\n            Spacer(Modifier.height(14.dp))\n'
          new = (
              '            Text("Drag to reframe • pinch or use the slider to zoom", style = MaterialTheme.typography.labelMedium)\n'
              '            Row(\n'
              '                Modifier.padding(horizontal = 20.dp).fillMaxWidth(),\n'
              '                verticalAlignment = Alignment.CenterVertically,\n'
              '                horizontalArrangement = Arrangement.spacedBy(10.dp)\n'
              '            ) {\n'
              '                Text("Zoom", style = MaterialTheme.typography.labelMedium)\n'
              '                Slider(\n'
              '                    value = crop.zoom,\n'
              '                    onValueChange = { crop = crop.copy(zoom = it) },\n'
              '                    valueRange = 1f..8f,\n'
              '                    modifier = Modifier.weight(1f)\n'
              '                )\n'
              '                Text(String.format(Locale.US, "%.1f×", crop.zoom), style = MaterialTheme.typography.labelMedium)\n'
              '            }\n'
              '            Spacer(Modifier.height(14.dp))\n'
          )
          if old not in text:
              raise SystemExit('Expected FrameScreen crop-help block was not found')
          app.write_text(text.replace(old, new, 1))
          PY
          cp CropCanvas.kt work/RankinRealms_Android_V3/app/src/main/java/com/rankinenvironments/realms/ui/CropCanvas.kt
          echo "Patched app build file:"
          cat work/RankinRealms_Android_V3/app/build.gradle.kts

      - name: Build Play debug APK
        working-directory: work/RankinRealms_Android_V3
        run: gradle :app:assemblePlayDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RankinRealms-Play-Debug
          path: work/RankinRealms_Android_V3/app/build/outputs/apk/play/debug/*.apk
          if-no-files-found: error
          retention-days: 14
